version: '3.8'

services:
  calcu:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: calcu-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Remember to change these in your production environment!
      - AUTH_SECRET=your_super_secret_auth_key_here_change_me
      - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      # Map the local prisma directory so the SQLite database persists across restarts
      - ./prisma:/app/prisma
